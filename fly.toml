app = "remix3"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/app.sqlite"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
